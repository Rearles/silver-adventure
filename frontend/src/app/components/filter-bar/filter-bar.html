<div class="filter-bar">
  <div class="group">
    <div class="group-label">Nation</div>
    <div class="chips">
      <button
        type="button"
        class="chip-btn"
        [class.active]="filter().nations.length === 0"
        (click)="onNationClick($event, null)"
      >
        All
      </button>
      @for (nation of nations(); track nation) {
        <button
          type="button"
          class="chip-btn"
          [class.active]="filter().nations.includes(nation)"
          title="Click to jump here; Ctrl/Cmd-click to combine with the current selection"
          (click)="onNationClick($event, nation)"
        >
          {{ nation }}
        </button>
      }
    </div>
  </div>

  <div class="group">
    <div class="group-label">House</div>
    <div class="chips">
      <button
        type="button"
        class="chip-btn"
        [class.active]="filter().houses.length === 0"
        (click)="onHouseClick($event, null)"
      >
        All
      </button>
      @for (house of houses(); track house) {
        <button
          type="button"
          class="chip-btn house-chip"
          [class.active]="filter().houses.includes(house)"
          [style.--house]="colorFor(house)"
          title="Click to jump here; Ctrl/Cmd-click to combine with the current selection"
          (click)="onHouseClick($event, house)"
        >
          <span class="house-dot"></span>
          {{ house }}
        </button>
      }
    </div>
  </div>

  <p class="counts">
    @if (isFiltered()) {
      <span class="count-core">{{ coreCount() }} in focus</span>
      @if (adjacentCount() > 0) {
        <span class="count-adjacent">+ {{ adjacentCount() }} married in or blood-linked</span>
      }
    } @else {
      <span class="count-core">{{ totalCount() }} people</span>
    }
  </p>
</div>
